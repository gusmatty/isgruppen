<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IS-gruppen – Passbokning</title>
<meta name="description" content="Boka pass för isspolning och snöröjning – Borlänge Bandy">
<meta property="og:title" content="IS-gruppen – Passbokning">
<meta property="og:description" content="Boka dig på pass för spolning, snöröjning och isvård – Borlänge Bandy">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b3d5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IS-gruppen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f2f6f9; --card: #fff; --ink: #14212b; --muted: #5d6b76; --line: #dbe3ea;
    --brand: #0b3d5c; --brand2: #1677b3;
    --red: #d64545; --red-bg: #fdeeee;
    --green: #2e9e5b; --green-bg: #eaf7ef;
    --full: #8a98a3; --full-bg: #f4f6f8;
    --jour: #3b6fd6; --jour-bg: #edf2fd;
    --past-bg: #eceff2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  header { position: sticky; top: 0; z-index: 20; background: var(--brand); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 small { font-weight: 400; opacity: .75; font-size: 13px; margin-left: 6px; }
  .hbtn { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 999px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
  .hbtn.admin-on { background: #f3c14b; color: #3a2a00; font-weight: 600; }
  .toolbar { display: flex; gap: 8px; padding: 10px 14px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: #e2e9ef; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .btn.primary { background: var(--brand2); border-color: var(--brand2); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--red); border-color: #f0c4c4; }
  .btn.big { padding: 12px 16px; font-size: 16px; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { padding: 0 14px 90px; }
  .day { margin: 14px 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .day.today { color: var(--brand2); }
  .card { background: var(--card); border-radius: var(--radius); border-left: 6px solid var(--line);
    padding: 10px 12px; margin: 6px 0; display: flex; gap: 10px; align-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: pointer; user-select: none; }
  .card .time { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 92px; }
  .card .mid { flex: 1; min-width: 0; }
  .card .ttl { font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cnt { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .card.red   { border-left-color: var(--red);   } .card.red   .cnt { background: var(--red-bg);   color: var(--red); }
  .card.green { border-left-color: var(--green); } .card.green .cnt { background: var(--green-bg); color: var(--green); }
  .card.full  { border-left-color: var(--full);  } .card.full  .cnt { background: var(--full-bg);  color: var(--full); }
  .card.jour  { border-left-color: var(--jour);  } .card.jour  .cnt { background: var(--jour-bg);  color: var(--jour); }
  .card.past  { background: var(--past-bg); opacity: .75; }
  .card.mine  { box-shadow: 0 0 0 2px var(--brand2) inset, 0 1px 2px rgba(0,0,0,.06); }
  .card.drop  { outline: 3px dashed var(--brand2); outline-offset: 2px; }
  .card.dragging { opacity: .45; }
  .card[draggable=true] { cursor: grab; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--jour-bg); color: var(--jour); margin-left: 4px; vertical-align: 1px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .more { display: block; margin: 16px auto; }

  /* Veckovy */
  .weekwrap { display: flex; gap: 14px; align-items: flex-start; }
  .names { position: sticky; top: 70px; width: 170px; flex: none; background: #fff; border-radius: var(--radius); padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .names h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .names .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .chip { display: inline-block; margin: 3px 3px 3px 0; padding: 6px 10px; border-radius: 999px; background: #e7f0f7; color: var(--brand); font-weight: 600; font-size: 14px; cursor: grab; border: 0; }
  .chip.me { background: var(--brand2); color: #fff; }
  .week { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .wcol { min-width: 0; }
  .wcol .whead { font-weight: 700; font-size: 13px; padding: 6px 4px; color: var(--muted); text-transform: uppercase; }
  .wcol .whead.today { color: var(--brand2); }
  .week .card { flex-direction: column; align-items: stretch; gap: 2px; padding: 8px; font-size: 14px; }
  .week .card .time { min-width: 0; }
  .week .card .sub { white-space: normal; }
  .week .card .cnt { align-self: flex-start; margin-top: 3px; }
  .weeknav { display: flex; align-items: center; gap: 8px; }
  .weeknav b { min-width: 150px; text-align: center; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,25,35,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: #fff; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .overlay { align-items: center; } .modal { border-radius: 16px; } }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal .x { float: right; border: 0; background: #eef2f5; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; }
  .modal .meta { color: var(--muted); margin-bottom: 10px; }
  .modal section { border-top: 1px solid var(--line); padding: 12px 0; }
  .modal section h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .booked { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .booked .rm { border: 0; background: none; color: var(--red); font-size: 14px; }
  .note { background: #f6f8fa; border-radius: 10px; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; }
  .note small { display: block; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=date], input[type=time], input[type=number], input[type=password], select, textarea {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { min-height: 70px; resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px; color: var(--ink); }
  .check input { width: 20px; height: 20px; }
  .alert { background: #fff6e0; border: 1px solid #f3d995; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .who { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .who button { padding: 14px 8px; border-radius: 12px; border: 1px solid var(--line); background: #f7fafc; font-weight: 600; }
  .who button.on { background: var(--brand2); color: #fff; border-color: var(--brand2); }
  .who .del { color: var(--red); font-weight: 400; font-size: 13px; display: block; }
  .log { font-size: 14px; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .log small { color: var(--muted); }
  .fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30; border: 0; border-radius: 999px;
    background: var(--brand2); color: #fff; font-weight: 700; padding: 14px 20px; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 16px; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #14212b; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 100; max-width: 90vw; text-align: center; }
  .toast.err { background: var(--red); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .wx { display: inline-block; font-size: 13px; color: var(--muted); }
  .wx.snow { color: var(--jour); font-weight: 700; }
  .wxday { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 8px; color: var(--muted); }
  .whead .wxday { margin-left: 0; font-size: 12px; }
  .wxrow { display: flex; gap: 8px; overflow-x: auto; }
  .wxrow span { flex: none; text-align: center; background: #f6f8fa; border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .wxrow small { color: var(--muted); }
  .credit { text-align: center; font-size: 12px; color: var(--muted); padding: 10px; }
  .setup { max-width: 560px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 12px; }
  @media (max-width: 420px) { .card .time { min-width: 78px; font-size: 15px; } header h1 small { display: none; } }
</style>
</head>
<body>
<header>
  <h1>IS-gruppen <small>Borlänge Bandy</small></h1>
  <button class="hbtn" id="meBtn">Vem är du?</button>
  <button class="hbtn" id="adminBtn">Admin</button>
</header>
<div class="toolbar" id="toolbar"></div>
<div class="legend">
  <span><i style="background:var(--red)"></i>Saknar folk</span>
  <span><i style="background:var(--green)"></i>Bemannat</span>
  <span><i style="background:var(--full)"></i>Fullt</span>
  <span><i style="background:var(--jour)"></i>Snöjour</span>
</div>
<main id="main"><div class="empty">Laddar…</div></main>
<div class="credit"><span id="wxsrc">Väderprognos laddas…</span> · <span id="ver">Gammal version – ladda om</span></div>
<button class="fab" id="newBtn">+ Nytt pass</button>
<div id="modalRoot"></div>

<script src="config.js?v=1.4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=1.4"></script>
</body>
</html>
